{% extends 'base.html' %}{% block public %}<div class="auth"><h2>Create applicant account</h2><p class="muted">Register to browse and apply for posted vacancies.</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><label>Full name<input name="name" required></label><label>Email address<input type="email" name="email" required></label><label>Password <small>(minimum 8 characters)</small><input type="password" name="password" minlength="8" required></label><button class="btn btn-primary full">Create account</button></form><p>Already registered? <a href="/login">Log in</a></p></div>{% endblock %}
